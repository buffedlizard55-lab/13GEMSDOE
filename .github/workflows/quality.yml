name: Site and submission verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned runtime and QA dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Obtain and pin-check official small rasters and historical TIFFs
        run: |
          bash scripts/download_competition_data.sh --small
          python scripts/fetch_scored_files.py
      - name: Unit, metric and current-primary format checks
        run: |
          python -m compileall -q src scripts tests
          python -m pytest tests -q
          python scripts/audit_metric.py
          python scripts/verify_download.py
          python scripts/build_site.py --check
      - name: Actual HTTP download and link checks
        run: python scripts/verify_site_http.py
      - name: Install real Chromium and pinned axe
        run: |
          python -m playwright install --with-deps chromium
          npm install --prefix .cache/browser --no-audit --no-fund axe-core@4.11.0
      - name: Real-browser, mobile, clipboard, corrupted-response and accessibility checks
        run: python scripts/verify_site_browser.py --require-axe
      - name: Publish verification evidence (never model data or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verification-${{ github.sha }}
          path: |
            .cache/site_http.json
            .cache/site_browser.json
            .cache/site-desktop.png
            .cache/site-mobile.png
          if-no-files-found: warn
          retention-days: 14
